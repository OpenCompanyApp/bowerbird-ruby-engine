name: engine qualification

on:
  pull_request:
    paths:
      - '.github/workflows/qualification.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'build_config.rb'
      - 'engine.lock.json'
      - 'native/**'
      - 'php/**'
      - 'src/**'
      - 'tests/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            uname: x86_64
          # GitHub documents this public-preview label for public repositories.
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            uname: aarch64
          - name: macOS ARM64
            runner: macos-14
            uname: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Verify the hosted runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      # Cargo.toml declares rust-version 1.87. Pinning to that minimum makes
      # compatibility evidence reproducible instead of depending on stable.
      - name: Set up the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.87'
          components: clippy

      - name: Set up Ruby and rake for the pinned mruby build
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Install rake
        run: gem install rake --no-document

      - name: Set up PHP 8.4 for adapter smoke tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Provision the exact mruby source
        shell: bash
        run: |
          set -euo pipefail
          mruby_upstream="$(php -r 'echo json_decode(file_get_contents("engine.lock.json"), true, 512, JSON_THROW_ON_ERROR)["upstream"];')"
          mruby_version="$(php -r 'echo json_decode(file_get_contents("engine.lock.json"), true, 512, JSON_THROW_ON_ERROR)["version"];')"
          mruby_commit="$(php -r 'echo json_decode(file_get_contents("engine.lock.json"), true, 512, JSON_THROW_ON_ERROR)["commit"];')"
          git clone --depth 1 --branch "$mruby_version" "$mruby_upstream" vendor/mruby
          git -C vendor/mruby checkout --detach "$mruby_commit"
          test "$(git -C vendor/mruby rev-parse HEAD)" = "$mruby_commit"
          test -z "$(git -C vendor/mruby status --porcelain --untracked-files=no)"

      - name: Lint, test, and build the bounded engine
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --locked --release

      - name: Exercise the PHP 8.4 adapter smoke scenarios
        env:
          RUBY_ENGINE_BINARY: ${{ github.workspace }}/target/release/ruby-engine
        run: php php/tests/smoke.php

      # This is an unsigned build record and dependency inventory, not a
      # release artifact or SLSA attestation. It is retained for CI diagnosis.
      - name: Collect Linux AMD64 provenance inputs
        if: matrix.name == 'Linux AMD64'
        run: |
          mkdir -p qualification-artifacts
          cargo metadata --locked --format-version 1 > qualification-artifacts/cargo-metadata.json
          cp Cargo.lock engine.lock.json build_config.rb.lock LICENSE NOTICE qualification-artifacts/
          sha256sum target/release/ruby-engine > qualification-artifacts/SHA256SUMS
          php -r '$record = ["source_revision" => trim(shell_exec("git rev-parse HEAD")), "rustc" => trim(shell_exec("rustc --version")), "mruby_commit" => json_decode(file_get_contents("engine.lock.json"), true, 512, JSON_THROW_ON_ERROR)["commit"]]; file_put_contents("qualification-artifacts/provenance-inputs.json", json_encode($record, JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR)."\n");'

      - name: Upload unsigned provenance inputs and dependency inventory
        if: matrix.name == 'Linux AMD64'
        uses: actions/upload-artifact@v4
        with:
          name: qualification-inputs-linux-amd64
          path: qualification-artifacts/
          if-no-files-found: error
          retention-days: 14

  asan-adversarial-smoke:
    name: Linux AMD64 AddressSanitizer adversarial smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up nightly Rust with standard-library sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Set up Ruby and rake for the pinned mruby build
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Install rake
        run: gem install rake --no-document

      - name: Provision the exact mruby source
        shell: bash
        run: |
          set -euo pipefail
          mruby_upstream="$(python3 -c 'import json; print(json.load(open("engine.lock.json"))["upstream"])')"
          mruby_version="$(python3 -c 'import json; print(json.load(open("engine.lock.json"))["version"])')"
          mruby_commit="$(python3 -c 'import json; print(json.load(open("engine.lock.json"))["commit"])')"
          git clone --depth 1 --branch "$mruby_version" "$mruby_upstream" vendor/mruby
          git -C vendor/mruby checkout --detach "$mruby_commit"
          test "$(git -C vendor/mruby rev-parse HEAD)" = "$mruby_commit"

      # Build both Rust and the C shim with ASan. This bounded smoke targets
      # fixed adversarial cases in the real contained guest; it does not
      # replace continuous fuzzing or weaken the production sandbox.
      - name: Run deterministic corpus under AddressSanitizer
        env:
          CFLAGS: -fsanitize=address
          # mruby's host tools compile with CFLAGS but link through its own
          # linker command. Keep the sanitizer runtime on that link line too.
          LDFLAGS: -fsanitize=address
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: exitcode=86:detect_leaks=1:halt_on_error=1
        run: |
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --locked --test adversarial_corpus
          nm -u vendor/mruby/build/guest/lib/libmruby.a | grep -q __asan
          find target/x86_64-unknown-linux-gnu -name libruby_guest_shim.a -exec nm -u {} \; | grep -q __asan

  protocol-fuzz-smoke:
    name: Coverage-guided protocol/value fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly Rust for libFuzzer
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-03-15

      - name: Install pinned cargo-fuzz outside the checkout
        env:
          CARGO_FUZZ_VERSION: 0.13.2
          CARGO_FUZZ_ROOT: ${{ runner.temp }}/cargo-fuzz
        run: |
          cargo install --root "$CARGO_FUZZ_ROOT" --version "$CARGO_FUZZ_VERSION" cargo-fuzz --locked
          echo "$CARGO_FUZZ_ROOT/bin" >> "$GITHUB_PATH"

      # libFuzzer returns nonzero for a sanitizer finding or target crash; do
      # not mask that status. The generated corpus is bounded and uploaded
      # only for failure diagnosis, not treated as a release artifact.
      - name: Run bounded coverage-guided frame and request fuzzing
        working-directory: fuzz
        run: |
          timeout --signal=TERM 90s cargo fuzz run protocol_frame -- -max_total_time=30 -timeout=2 -rss_limit_mb=256 -max_len=1048576
          timeout --signal=TERM 90s cargo fuzz run request_admission -- -max_total_time=30 -timeout=2 -rss_limit_mb=256 -max_len=1048576

      - name: Upload failing fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

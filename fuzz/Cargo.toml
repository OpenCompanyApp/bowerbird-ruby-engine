[package]
name = "bowerbird-ruby-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.12"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

# Keep fuzz targets outside the production workspace and its release builds.
[workspace]
members = ["."]

[[bin]]
name = "protocol_frame"
path = "fuzz_targets/protocol_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_admission"
path = "fuzz_targets/request_admission.rs"
test = false
doc = false
bench = false
